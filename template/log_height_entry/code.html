<button class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity active:duration-100 scale-95">
            settings
        </button>
</header>
<main class="flex-grow flex flex-col items-center justify-center p-screen-edge relative">
<!-- Background Decorative Element (Medical Glow) -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary-container/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[20%] -right-[10%] w-[30%] h-[30%] bg-secondary-container/5 blur-[100px] rounded-full"></div>
</div>
<!-- Modal Content Container -->
<div class="w-full max-w-lg bg-surface-container-low rounded-xl border border-outline-variant shadow-2xl relative z-10 overflow-hidden">
<!-- Modal Header -->
<div class="p-lg flex justify-between items-center border-b border-outline-variant">
<div>
<h2 class="font-heading-1 text-heading-1 text-text-primary-dark">Log Height</h2>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Biometric Precision Entry</p>
</div>
<button class="material-symbols-outlined text-on-surface-variant hover:text-text-primary-dark transition-colors">
                    close
                </button>
</div>
<!-- Modal Body -->
<div class="p-lg space-y-section-gap">
<!-- Unit Switcher -->
<div class="flex bg-surface-container rounded-full p-xs border border-outline-variant w-fit mx-auto">
<button class="px-lg py-sm rounded-full bg-primary-container text-on-primary-container font-heading-2 text-label-caps transition-all glow-active">CM</button>
<button class="px-lg py-sm rounded-full text-on-surface-variant font-heading-2 text-label-caps hover:text-text-primary-dark transition-all">FT/IN</button>
</div>
<!-- Horizontal Drum Picker (CM) -->
<div class="relative py-xl">
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-20 h-24 border-x-2 border-primary-fixed-dim glow-active opacity-40"></div>
<div class="absolute top-0 h-full w-[2px] bg-primary-fixed-dim z-20 shadow-[0_0_10px_#00e478]"></div>
</div>
<div class="drum-picker-mask overflow-x-auto flex items-end gap-md no-scrollbar px-[50%] pb-md cursor-grab active:cursor-grabbing">

<div class="flex items-end gap-4 shrink-0">
<div class="flex flex-col items-center gap-sm">

</div>

<span class="font-display-xl text-display-xl text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,228,120,0.4)]">179.5</span>
<span class="font-heading-2 text-heading-2 text-on-surface-variant ml-sm">cm</span>
</div>

<div class="space-y-md">

<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">Measurement Date</label>
<div class="relative">
<input class="w-full h-[52px] bg-surface-container-highest border border-outline-variant rounded-lg px-md text-text-primary-dark focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim outline-none transition-all appearance-none" type="date" value="2023-10-27"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">

                            </span>
</div>
</div>

<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">Observation Notes</label>
<textarea class="w-full bg-surface-container-highest border border-outline-variant rounded-lg p-md text-text-primary-dark focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim outline-none transition-all resize-none font-body-lg" placeholder="Morning measurement, posture focused..." rows="3"></textarea>

<button class="w-full h-14 bg-primary-container text-on-primary-container font-heading-1 text-heading-2 rounded-full flex items-center justify-center gap-sm hover:opacity-90 active:scale-95 transition-all shadow-[0_10px_30px_rgba(0,255,135,0.2)]">

</button>
<button class="w-full mt-md py-sm font-label-caps text-label-caps text-on-surface-variant hover:text-text-primary-dark transition-colors uppercase">
